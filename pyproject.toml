[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch"
version = "0.2.0"
description = "Dependency-free cybersecurity toolkit: phishing detection, pcap traffic analysis, honeypots and log correlation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "phishing", "pcap", "honeypot", "log-analysis", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[tool.setuptools.packages.find]
include = ["nightwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
